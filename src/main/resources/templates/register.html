<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Campus Bike</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div class="auth-wrap">

  <!-- LEFT PANEL -->
  <div class="auth-left">
    <div class="brand-icon">🚲</div>
    <h1>Join Campus Bike</h1>
    <p>Create your account today</p>
    <div class="auth-features">
      <div class="auth-feat"><span class="auth-feat-icon">🎓</span><span>For campus students only</span></div>
      <div class="auth-feat"><span class="auth-feat-icon">⚡</span><span>Start riding in minutes</span></div>
      <div class="auth-feat"><span class="auth-feat-icon">🌱</span><span>Eco-friendly commuting</span></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-right" style="overflow-y:auto;max-height:100vh;padding:40px 48px;">
    <div class="logo-sm">🚲 Campus Bike</div>
    <div class="tagline">Create your account</div>
    <h2>Register</h2>

    <!-- Flash messages -->
    <div class="alert alert-error"   th:if="${errorMessage}"   th:text="${errorMessage}"></div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- REGISTER FORM — same fields as Android RegisterActivity.java -->
    <form th:action="@{/register}" method="post" style="width:100%">

      <div class="register-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="fullName" placeholder="Your full name" required/>
        </div>
        <div class="form-group">
          <label>Student ID</label>
          <input type="text" name="studentId" placeholder="e.g. 2023CS001" required/>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="student@university.edu" required/>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="+91 XXXXXXXXXX" required/>
      </div>

      <div class="register-grid">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Min 6 characters" required/>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirmPassword" placeholder="Repeat password" required/>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">CREATE ACCOUNT</button>
    </form>

    <div class="auth-footer" style="margin-top:14px">
      Already have an account?
      <b onclick="window.location='/login'">Login</b>
    </div>
  </div>

</div>

<script th:src="@{/js/main.js}"></script>
<span id="flash-error"   style="display:none" th:attr="data-msg=${errorMessage}"></span>
<span id="flash-success" style="display:none" th:attr="data-msg=${successMessage}"></span>
</body>
</html>
