<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activePage, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' — Campus Bike'">Campus Bike</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<!-- Flash message holders (read by main.js) -->
<span id="flash-success" style="display:none"
      th:attr="data-msg=${successMessage}"></span>
<span id="flash-error" style="display:none"
      th:attr="data-msg=${errorMessage}"></span>

<div class="app-layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🚲</span>
      <span class="logo-name">Campus Bike</span>
    </div>

    <div class="sidebar-wallet">
      <div class="label">Wallet Balance</div>
      <div class="amount" th:text="'Rs. ' + ${walletBalance}">Rs. 100.00</div>
      <a href="#" class="add-btn" onclick="openModal('add-money-modal'); return false;">+ Add Money</a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a class="nav-item" th:classappend="${activePage == 'home'} ? 'active'" th:href="@{/home}">
        <span class="nav-icon">🗺️</span> Home Map
      </a>
      <a class="nav-item" th:classappend="${activePage == 'scan'} ? 'active'" th:href="@{/scan}">
        <span class="nav-icon">📷</span> Scan QR
      </a>
      <a class="nav-item" th:classappend="${activePage == 'ride'} ? 'active'" th:href="@{/ride}">
        <span class="nav-icon">🚴</span> Active Ride
      </a>

      <div class="nav-section-label">Account</div>
      <a class="nav-item" th:classappend="${activePage == 'history'} ? 'active'" th:href="@{/history}">
        <span class="nav-icon">📋</span> Ride History
      </a>
      <a class="nav-item" th:classappend="${activePage == 'profile'} ? 'active'" th:href="@{/profile}">
        <span class="nav-icon">👤</span> Profile
      </a>
      <a class="nav-item sos-link" th:classappend="${activePage == 'sos'} ? 'active'" th:href="@{/sos}">
        <span class="nav-icon">🆘</span> SOS Emergency
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="user-card" th:href="@{/profile}">
        <div class="user-avatar">👤</div>
        <div class="user-info">
          <div class="name" th:text="${userName}">Campus Student</div>
          <div class="uid" th:text="'ID: ' + ${studentId}">ID: —</div>
        </div>
      </a>
    </div>
  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <div class="main-content">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-title" th:text="${title}">Home Map</div>
      <div class="topbar-right">
        <div class="stats-pill"><div class="dot dot-blue"></div> 12 Bikes</div>
        <div class="stats-pill"><div class="dot dot-green"></div> 4 Stations</div>
        <div class="stats-pill"><div class="dot dot-amber"></div> 50m Away</div>
      </div>
    </div>

    <!-- PAGE CONTENT (injected by each template) -->
    <div class="page-content">
      <th:block th:replace="${content}"/>
    </div>

  </div><!-- end main-content -->
</div><!-- end app-layout -->

<!-- ══ ADD MONEY MODAL ══ -->
<div class="modal-overlay" id="add-money-modal">
  <div class="modal">
    <h3>💳 Add Money to Wallet</h3>
    <form th:action="@{/profile/add-money}" method="post">
      <div class="form-group">
        <label>Amount (Rs.)</label>
        <input type="number" id="add-amount" name="amount" placeholder="Enter amount" min="10" required/>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--text3);margin-bottom:8px">Quick select</div>
      <div class="quick-amounts">
        <button type="button" onclick="setAmount(50)">Rs. 50</button>
        <button type="button" onclick="setAmount(100)">Rs. 100</button>
        <button type="button" onclick="setAmount(200)">Rs. 200</button>
        <button type="button" onclick="setAmount(500)">Rs. 500</button>
      </div>
      <div class="modal-btns">
        <button type="button" class="btn-cancel" onclick="closeModal('add-money-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" style="width:auto;flex:1;margin:0">PAY VIA UPI</button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
