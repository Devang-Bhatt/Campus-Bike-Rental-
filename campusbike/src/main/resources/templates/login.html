<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Campus Bike</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div class="auth-wrap">

  <!-- LEFT PANEL -->
  <div class="auth-left">
    <div class="brand-icon">🚲</div>
    <h1>Campus Bike</h1>
    <p>Smart Bicycle Rental System</p>
    <div class="auth-features">
      <div class="auth-feat"><span class="auth-feat-icon">🗺️</span><span>Live map of available bikes</span></div>
      <div class="auth-feat"><span class="auth-feat-icon">📱</span><span>Scan QR to unlock instantly</span></div>
      <div class="auth-feat"><span class="auth-feat-icon">💳</span><span>UPI wallet payments</span></div>
      <div class="auth-feat"><span class="auth-feat-icon">🆘</span><span>Campus SOS emergency alert</span></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-right">
    <div class="logo-sm">🚲 Campus Bike</div>
    <div class="tagline">Smart Bicycle Rental System</div>
    <h2>Welcome back</h2>

    <!-- Flash messages -->
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- LOGIN FORM — same fields as Android LoginActivity.java -->
    <form th:action="@{/login}" method="post" style="width:100%">

      <div class="form-group">
        <label>Student ID</label>
        <input type="text" name="studentId" placeholder="Enter your student ID" required/>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required/>
      </div>

      <div class="form-row">
        <a class="link" href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary">LOGIN</button>
    </form>

    <div class="divider">or</div>

    <!-- Google Sign-In button (wires to OAuth2 when configured) -->
    <button class="btn btn-google" onclick="showToast('Google Sign-In: configure OAuth2 in application.properties','info')">
      <div class="google-icon"></div> CONTINUE WITH GOOGLE
    </button>

    <div class="auth-footer">
      Don't have an account?
      <b onclick="window.location='/register'">Register</b>
    </div>
  </div>

</div>

<script th:src="@{/js/main.js}"></script>
<!-- Show spring flash messages via toast -->
<span id="flash-error"   style="display:none" th:attr="data-msg=${errorMessage}"></span>
<span id="flash-success" style="display:none" th:attr="data-msg=${successMessage}"></span>
</body>
</html>
